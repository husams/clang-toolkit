syntax = "proto3";
package ctk.analysis.v1;

import "match/v1/match_service.proto";
import "match/v1/resources.proto";

import "analysis/v1/value_projection.proto";

message TraverseRequest {
  // A path, pinned parsed tree, or native binding. Retained targets do not
  // reparse, mutate the source cursor, or apply matcher scope restrictions.
  oneof target {
    ctk.match.v1.FileMatchTarget file = 1;
    ctk.match.v1.SessionMatchTarget session = 9;
    ctk.match.v1.BindingMatchTarget binding = 10;
    ctk.match.v1.FileHandleTarget file_handle = 11;
  }
  // RecursiveASTVisitor options; these are not matcher traversal policies.
  bool visit_implicit_code = 2;
  bool visit_template_instantiations = 3;
  // Root depth is zero. Default is 64; explicit zero returns only the root.
  optional uint32 max_depth = 4;
  // Default is 10,000; hard server maximum is 100,000.
  optional uint64 max_nodes = 5;
  ValueProjection projection = 6;
  // Restrict declaration/statement candidates by expansion in the main file.
  bool main_file_only = 7;
  string resource_scope_id = 8;
}
