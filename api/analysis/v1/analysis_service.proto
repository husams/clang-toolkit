syntax = "proto3";
package ctk.analysis.v1;

import "analysis/v1/traverse_request.proto";
import "analysis/v1/traverse_response.proto";
import "analysis/v1/traverse_stream.proto";
import "analysis/v1/cfg_request.proto";
import "analysis/v1/cfg_response.proto";
import "analysis/v1/cfg_stream.proto";
import "analysis/v1/variable_flow.proto";

import "analysis/v1/call_graph_request.proto";
import "analysis/v1/call_graph_response.proto";
import "analysis/v1/call_graph_stream.proto";
import "analysis/v1/script_request.proto";
import "analysis/v1/script_response.proto";
import "analysis/v1/batch.proto";
service AnalysisService {
  rpc StartBatch(StartBatchRequest) returns (BatchRun);
  rpc BatchStatus(BatchRunRequest) returns (BatchRun);
  rpc CancelBatch(BatchControlRequest) returns (BatchRun);
  rpc ResumeBatch(BatchControlRequest) returns (BatchRun);
  rpc RetryBatch(BatchControlRequest) returns (BatchRun);
  rpc RunScript(ScriptRequest) returns (ScriptResponse);
  // Owned semantic values from a standalone native AST visitor. On node/byte
  // limits or cancellation, no partial response is returned.
  rpc Traverse(TraverseRequest) returns (TraverseResponse);
  // Preorder nodes are written as visited, with transport backpressure. A
  // successful stream has exactly one completion and terminal OK. Failures
  // may follow provisional nodes, but never publish completion. No cursor is
  // modified. Each event, rather than the aggregate stream, is byte bounded.
  rpc StreamTraverse(TraverseRequest) returns (stream TraverseStreamEvent);
  rpc CallGraph(CallGraphRequest) returns (CallGraphResponse);
  // Bounded static call graph records are emitted independently with backpressure.
  // A successful stream has one completion and terminal OK.
  rpc StreamCallGraph(CallGraphRequest) returns (stream CallGraphStreamEvent);
  rpc Cfg(CfgRequest) returns (CfgResponse);
  // Native CFGs are built per function, then serialized one block at a time.
  // Each event is byte bounded; count limits apply across the whole request.
  // An oversized block or cancellation fails without request completion.
  rpc StreamCfg(CfgRequest) returns (stream CfgStreamEvent);
  // Provisional usage sites precede converged facts. Require completion and
  // terminal OK; incomplete completion explicitly signals unsupported effects.
  rpc StreamVariableFlow(VariableFlowRequest) returns (stream VariableFlowEvent);
}
