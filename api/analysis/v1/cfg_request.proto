syntax = "proto3";
package ctk.analysis.v1;
import "match/v1/match_service.proto";
import "match/v1/resources.proto";
import "analysis/v1/cfg_options.proto";
import "analysis/v1/value_projection.proto";

message CfgRequest {
  // Retained targets pin the existing AST; invalid references never reparse.
  oneof target {
    ctk.match.v1.FileMatchTarget file = 1;
    ctk.match.v1.SessionMatchTarget session = 10;
    ctk.match.v1.BindingMatchTarget binding = 11;
    ctk.match.v1.FileHandleTarget file_handle = 12;
  }
  // Exact qualified name for file/session/file_handle. Omit for an exact binding.
  string function = 2;
  CfgOptions options = 3;
  optional uint64 max_functions = 4; // Default 100; hard limit 1000.
  optional uint64 max_blocks = 5; // Across all graphs; default 10000, hard limit 100000.
  optional uint64 max_elements = 6; // Default 100000; hard limit 1000000.
  ValueProjection projection = 7;
  bool main_file_only = 8;
  string resource_scope_id = 9;
}
