syntax = "proto3";
package ctk.query.v1;

import "query/v1/errors.proto";
import "match/v1/match_result.proto";

message Queued {
  // Pending requests only; running workers do not count against queue capacity.
  uint64 pending_requests = 1;
}
message Started {}

// Actual counts, not an estimated percentage. Adding files can grow the total.
message Progress {
  string file = 1;
  string profile = 2;
  uint64 completed_files = 3;
  uint64 accepted_files = 4;
}

// Direct semantic values copied from a native callback, never native handles.
// These summaries do not replace the versioned AST MatchResult contract.
message SemanticBinding {
  string kind = 1;
  string name = 2;
  string type = 3;
}
message MatchEvent {
  string file = 1;
  string profile = 2;
  // Keys are matcher binding names.
  map<string, SemanticBinding> bindings = 3;
  // Complete, owned semantic payloads. The summary map above remains available
  // to existing clients; this row preserves the versioned AST binding schema.
  ctk.match.v1.MatchResult semantic_result = 4;
}

// Zero matches is valid. Successful collection requires both this event and
// terminal gRPC OK. Non-OK termination leaves only partial results.
message Completed {
  uint64 completed_files = 1;
  uint64 match_count = 2;
}

message Control {
  // query-defined, files-accepted, matching, paused or resumed.
  string action = 1;
}

// Events from different files/profiles may interleave; discovery is not sorted.
// Exactly one event is set. Correlation is per command, not a session handle.
message QueryEvent {
  string request_id = 1;
  oneof event {
    Queued queued = 2;
    Started started = 3;
    Progress progress = 4;
    MatchEvent match = 5;
    Completed completed = 6;
    Rejected rejected = 7;
    Control control = 8;
  }
}
