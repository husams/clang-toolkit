syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message WhileStmt {
  reserved 1;
  reserved "statement";
  DeclarationValue condition_variable = 2;
  ExpressionValue condition = 3;
  StatementValue body = 4;
  optional bool is_constexpr = 5;
  optional bool is_condition_false = 6;
}
