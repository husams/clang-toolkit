syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message CXXConstructorDecl {
  CXXMethodDeclInfo method = 1;
  repeated CXXCtorInitializer initializers = 2;
  optional bool is_explicit = 3;
  optional bool is_explicit_specifier_value = 4;
  optional bool is_converting_constructor = 5;
  optional bool is_copy_constructor = 6;
  optional bool is_move_constructor = 7;
  optional bool is_default_constructor = 8;
  optional bool is_delegating_constructor = 9;
  ExpressionValue explicit_specifier_expression = 10;
}
