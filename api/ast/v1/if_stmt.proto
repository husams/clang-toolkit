syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message IfStmt {
  reserved 1;
  reserved "statement";
  StatementValue init_statement = 2;
  DeclarationValue condition_variable = 3;
  ExpressionValue condition = 4;
  StatementValue then_statement = 5;
  StatementValue else_statement = 6;
  optional bool is_constexpr = 7;
  optional bool is_negated_condition = 8;
  optional bool is_consteval = 9;
}
