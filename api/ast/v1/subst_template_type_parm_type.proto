syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message SubstTemplateTypeParmType {
  TypeInfo info = 1;
  QualType replacement_type = 2;
  DeclarationSymbol associated_declaration = 3;
  DeclarationSymbol replaced_parameter = 4;
  optional uint32 parameter_index = 5;
  optional uint32 pack_index = 6;
  optional bool is_final = 7;
}
