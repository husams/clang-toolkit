syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message GCCAsmStmt {
  reserved 1;
  reserved "statement";
  optional string asm_string = 2;
  repeated AsmOperand outputs = 3;
  repeated AsmOperand inputs = 4;
  repeated string clobbers = 5;
  repeated DeclarationSymbol goto_labels = 6;
  optional bool is_simple = 7;
  optional bool is_volatile = 8;
  optional bool is_goto = 9;
  optional string dialect = 10;
}
