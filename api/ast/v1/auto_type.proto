syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message AutoType {
  TypeInfo info = 1;
  QualType deduced_type = 2;
  optional AutoKeyword keyword = 3;
  optional bool is_constrained = 5;
  DeclarationSymbol type_constraint_concept = 6;
  repeated TemplateArgument type_constraint_arguments = 7;
}
