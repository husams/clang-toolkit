syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/common.proto";
import "ast/v1/semantic_types.proto";

message VariableArrayType {
  TypeInfo info = 1;
  QualType element_type = 2;
  ExpressionValue size_expression = 3;
  optional ArraySizeModifier size_modifier = 4;
  Qualifiers index_qualifiers = 5;
}
