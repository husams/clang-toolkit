syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message LambdaExpr {
  ExprInfo info = 1;
  DeclarationSymbol closure_class = 2;
  repeated LambdaCapture captures = 3;
  repeated ExpressionValue capture_initializers = 4;
  DeclarationSymbol call_operator = 5;
  optional bool is_generic_lambda = 6;
  optional bool is_mutable = 7;
}
