syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message CXXNewExpr {
  ExprInfo info = 1;
  DeclarationSymbol operator_new = 2;
  DeclarationSymbol operator_delete = 3;
  QualType allocated_type = 4;
  ExpressionValue array_size = 5;
  ExpressionValue initializer = 6;
  optional bool is_array = 7;
  optional bool is_global_new = 8;
  optional bool is_nothrow = 9;
  optional bool is_placement = 10;
  repeated ExpressionValue placement_arguments = 11;
}
