syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message CXXDependentScopeMemberExpr {
  ExprInfo info = 1;
  ExpressionValue base = 2;
  NestedNameSpecifier qualifier = 3;
  DeclarationName member_name = 4;
  optional bool is_arrow = 5;
  optional bool is_explicit_template_arguments = 6;
  repeated TemplateArgument template_arguments = 7;
}
