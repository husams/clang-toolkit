syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message NonTypeTemplateParmDecl {
  DeclaratorDeclInfo declarator = 1;
  optional uint32 depth = 2;
  optional uint32 position = 3;
  optional bool is_parameter_pack = 4;
  TemplateArgument default_argument = 5;
  optional bool default_argument_was_inherited = 6;
  optional bool is_pack_expansion = 7;
  repeated QualType expanded_parameter_types = 8;
  TypeConstraint type_constraint = 9;
}
