syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message InjectedClassNameType {
  reserved 4;
  reserved "keyword";
  TypeInfo info = 1;
  DeclarationSymbol declaration = 2;
  NestedNameSpecifier qualifier = 3;
  DeclarationSymbol template_declaration = 5;
  TemplateName template_name = 6;
  repeated TemplateArgument specialization_arguments = 7;
}
