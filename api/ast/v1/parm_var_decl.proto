syntax = "proto3";

package ctk.ast.v1;

import "ast/v1/semantic_types.proto";

message ParmVarDecl {
  VarDeclInfo variable = 1;
  ExpressionValue default_argument = 2;
  optional uint32 function_scope_index = 3;
  optional uint32 function_scope_depth = 4;
  optional bool is_parameter_pack = 5;
  optional bool is_explicit_object_parameter = 6;
}
