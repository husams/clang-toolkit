syntax = "proto3";

package ctk.ast.v1;

// Shared helpers and typed recursive wrappers; compiled via api/assemble_ast.py.
import "ast/v1/common.proto";
import "ast/v1/operators.proto";

enum SymbolKind {
  SYMBOL_KIND_UNSPECIFIED = 0;
  SYMBOL_KIND_NAMESPACE = 1;
  SYMBOL_KIND_RECORD = 2;
  SYMBOL_KIND_ENUM = 3;
  SYMBOL_KIND_TYPE_ALIAS = 4;
  SYMBOL_KIND_FUNCTION = 5;
  SYMBOL_KIND_METHOD = 6;
  SYMBOL_KIND_CONSTRUCTOR = 7;
  SYMBOL_KIND_DESTRUCTOR = 8;
  SYMBOL_KIND_VARIABLE = 9;
  SYMBOL_KIND_FIELD = 10;
  SYMBOL_KIND_PARAMETER = 11;
  SYMBOL_KIND_TEMPLATE = 12;
  SYMBOL_KIND_CONCEPT = 13;
  SYMBOL_KIND_LABEL = 14;
  SYMBOL_KIND_UNRESOLVED = 15;
  SYMBOL_KIND_OTHER = 16;
}

message DeclarationSymbol {
  optional string name = 1;
  optional string qualified_name = 2;
  optional SymbolKind kind = 3;
  TypeDescription type = 4;
  FunctionSignature function = 5;
  optional string clang_class = 6;
  repeated TemplateArgumentDescription template_arguments = 7;
  optional bool is_parameter_pack = 8;
  optional OverloadedOperatorKind overloaded_operator = 9;
}

message TypeDescription {
  optional string spelling = 1;
  optional string canonical_spelling = 2;
  Qualifiers qualifiers = 3;
  optional bool is_dependent = 4;
}

enum TemplateArgumentDescriptionKind {
  TEMPLATE_ARGUMENT_DESCRIPTION_KIND_UNSPECIFIED = 0;
  TEMPLATE_ARGUMENT_DESCRIPTION_KIND_NULL = 1;
  TEMPLATE_ARGUMENT_DESCRIPTION_KIND_TYPE = 2;
  TEMPLATE_ARGUMENT_DESCRIPTION_KIND_DECLARATION = 3;
  TEMPLATE_ARGUMENT_DESCRIPTION_KIND_NULL_POINTER = 4;
  TEMPLATE_ARGUMENT_DESCRIPTION_KIND_INTEGRAL = 5;
  TEMPLATE_ARGUMENT_DESCRIPTION_KIND_STRUCTURAL_VALUE = 6;
  TEMPLATE_ARGUMENT_DESCRIPTION_KIND_TEMPLATE = 7;
  TEMPLATE_ARGUMENT_DESCRIPTION_KIND_TEMPLATE_EXPANSION = 8;
  TEMPLATE_ARGUMENT_DESCRIPTION_KIND_EXPRESSION = 9;
  TEMPLATE_ARGUMENT_DESCRIPTION_KIND_PACK = 10;
}

message TemplateArgumentDescription {
  optional TemplateArgumentDescriptionKind kind = 1;
  optional string semantic_spelling = 2;
  TypeDescription type = 3;
  APSIntBits integer = 4;
  APFloatBits floating = 5;
  repeated TemplateArgumentDescription pack_elements = 6;
}

enum TemplateParameterDescriptionKind {
  TEMPLATE_PARAMETER_DESCRIPTION_KIND_UNSPECIFIED = 0;
  TEMPLATE_PARAMETER_DESCRIPTION_KIND_TYPE = 1;
  TEMPLATE_PARAMETER_DESCRIPTION_KIND_NON_TYPE = 2;
  TEMPLATE_PARAMETER_DESCRIPTION_KIND_TEMPLATE = 3;
}

message TemplateParameterDescription {
  optional TemplateParameterDescriptionKind kind = 1;
  optional string name = 2;
  TypeDescription type = 3;
  optional bool is_parameter_pack = 4;
  repeated TemplateParameterDescription template_parameters = 5;
}

message ConstraintDescription {
  optional string semantic_expression = 1;
  optional bool is_dependent = 2;
  optional bool is_satisfied = 3;
}

message ExceptionDescription {
  optional ExceptionSpecification kind = 1;
  repeated TypeDescription exception_types = 2;
  optional bool is_noexcept = 3;
  ConstraintDescription dependent_condition = 4;
}

message ParameterValue {
  reserved 3;
  reserved "default_argument";
  optional string name = 1;
  TypeDescription type = 2;
  optional bool is_parameter_pack = 4;
}

message FunctionSignature {
  TypeDescription return_type = 1;
  repeated ParameterValue parameters = 2;
  optional bool is_variadic = 3;
  optional bool is_const = 4;
  optional bool is_volatile = 5;
  optional RefQualifier ref_qualifier = 6;
  optional bool is_static = 7;
  FunctionExtInfo calling_convention = 8;
  ExceptionDescription exception_specification = 9;
  repeated TemplateParameterDescription template_parameters = 10;
  repeated ConstraintDescription associated_constraints = 11;
}

message AttributeValue {
  optional string clang_class = 1;
  optional FieldState state = 2;
  optional string reason = 3;
}

message CleanupValue {
  oneof value {
    DeclarationSymbol block = 1;
    ExpressionValue compound_literal = 2;
  }
}

message QualType {
  TypeValue type = 1;
  Qualifiers qualifiers = 2;
}

enum FloatingSemantics {
  FLOATING_SEMANTICS_UNSPECIFIED = 0;
  FLOATING_SEMANTICS_IEEE_HALF = 1;
  FLOATING_SEMANTICS_BFLOAT = 2;
  FLOATING_SEMANTICS_IEEE_SINGLE = 3;
  FLOATING_SEMANTICS_IEEE_DOUBLE = 4;
  FLOATING_SEMANTICS_IEEE_QUAD = 5;
  FLOATING_SEMANTICS_X87_DOUBLE_EXTENDED = 6;
  FLOATING_SEMANTICS_PPC_DOUBLE_DOUBLE = 7;
  FLOATING_SEMANTICS_PPC_DOUBLE_DOUBLE_LEGACY = 8;
  FLOATING_SEMANTICS_FLOAT8_E5_M2 = 9;
  FLOATING_SEMANTICS_FLOAT8_E5_M2_FNUZ = 10;
  FLOATING_SEMANTICS_FLOAT8_E4_M3 = 11;
  FLOATING_SEMANTICS_FLOAT8_E4_M3_FN = 12;
  FLOATING_SEMANTICS_FLOAT8_E4_M3_FNUZ = 13;
  FLOATING_SEMANTICS_FLOAT8_E4_M3_B11_FNUZ = 14;
  FLOATING_SEMANTICS_FLOAT8_E3_M4 = 15;
  FLOATING_SEMANTICS_FLOAT_TF32 = 16;
  FLOATING_SEMANTICS_FLOAT8_E8_M0_FNU = 17;
  FLOATING_SEMANTICS_FLOAT6_E3_M2_FN = 18;
  FLOATING_SEMANTICS_FLOAT6_E2_M3_FN = 19;
  FLOATING_SEMANTICS_FLOAT4_E2_M1_FN = 20;
}

enum LambdaCaptureKind {
  LAMBDA_CAPTURE_KIND_UNSPECIFIED = 0;
  LAMBDA_CAPTURE_KIND_THIS = 1;
  LAMBDA_CAPTURE_KIND_STAR_THIS = 2;
  LAMBDA_CAPTURE_KIND_BY_COPY = 3;
  LAMBDA_CAPTURE_KIND_BY_REFERENCE = 4;
  LAMBDA_CAPTURE_KIND_VLA_TYPE = 5;
}

enum ExprRequirementSatisfactionStatus {
  EXPR_REQUIREMENT_SATISFACTION_STATUS_UNSPECIFIED = 0;
  EXPR_REQUIREMENT_SATISFACTION_STATUS_DEPENDENT = 1;
  EXPR_REQUIREMENT_SATISFACTION_STATUS_EXPR_SUBSTITUTION_FAILURE = 2;
  EXPR_REQUIREMENT_SATISFACTION_STATUS_NOEXCEPT_NOT_MET = 3;
  EXPR_REQUIREMENT_SATISFACTION_STATUS_TYPE_REQUIREMENT_SUBSTITUTION_FAILURE = 4;
  EXPR_REQUIREMENT_SATISFACTION_STATUS_CONSTRAINTS_NOT_SATISFIED = 5;
  EXPR_REQUIREMENT_SATISFACTION_STATUS_SATISFIED = 6;
}

message APIntBits {
  optional uint32 bit_width = 1;
  optional bytes little_endian_bits = 2;
  optional string unsigned_decimal = 3;
}

message APSIntBits {
  APIntBits value = 1;
  optional bool is_unsigned = 2;
  optional string decimal_value = 3;
}

message APFloatBits {
  optional FloatingSemantics semantics = 1;
  APIntBits bit_pattern = 2;
  optional string decimal_value = 3;
}

message APFixedPointBits {
  APIntBits bit_pattern = 1;
  optional uint32 scale = 2;
  optional bool is_unsigned = 3;
  optional bool is_saturated = 4;
  optional bool has_unsigned_padding = 5;
}

message DeclarationName {
  oneof value {
    string identifier = 1;
    QualType constructor_type = 2;
    QualType destructor_type = 3;
    QualType conversion_type = 4;
    OverloadedOperatorKind overloaded_operator = 5;
    string literal_operator_suffix = 6;
    DeclarationSymbol deduction_guide_template = 7;
    Empty using_directive = 8;
    Empty empty_name = 9;
  }
}

message NestedNamespaceName {
  DeclarationSymbol declaration = 1;
  NestedNameSpecifier prefix = 2;
}

message NestedNameSpecifier {
  oneof value {
    Empty null_specifier = 1;
    Empty global = 2;
    NestedNamespaceName namespace_name = 3;
    QualType type = 4;
    DeclarationSymbol microsoft_super_record = 5;
  }
}

message OverloadedTemplateName {
  repeated DeclarationSymbol declarations = 1;
}

message QualifiedTemplateName {
  reserved 3;
  reserved "has_template_keyword";
  NestedNameSpecifier qualifier = 1;
  TemplateName unqualified = 2;
}

message DependentTemplateName {
  NestedNameSpecifier qualifier = 1;
  DeclarationName name = 2;
}

message SubstitutedTemplateName {
  DeclarationSymbol parameter = 1;
  TemplateName replacement = 2;
  optional uint32 parameter_index = 3;
  optional uint32 pack_index = 4;
  optional bool is_final = 5;
}

message SubstitutedTemplatePack {
  DeclarationSymbol parameter = 1;
  repeated TemplateArgument arguments = 2;
  optional uint32 parameter_index = 3;
  optional bool is_final = 4;
}

message DeducedTemplateName {
  TemplateName underlying = 1;
  repeated TemplateArgument default_arguments = 2;
  optional uint32 default_argument_start = 3;
}

message TemplateName {
  oneof value {
    DeclarationSymbol declaration = 1;
    OverloadedTemplateName overload = 2;
    DeclarationName assumed = 3;
    QualifiedTemplateName qualified = 4;
    DependentTemplateName dependent = 5;
    SubstitutedTemplateName substituted = 6;
    SubstitutedTemplatePack substituted_pack = 7;
    DeclarationSymbol using_shadow = 8;
    DeducedTemplateName deduced = 9;
    Empty null_name = 10;
  }
}

message IntegralTemplateArgument {
  APSIntBits value = 1;
  QualType type = 2;
}

message DeclarationTemplateArgument {
  DeclarationSymbol declaration = 1;
  QualType parameter_type = 2;
}

message StructuralTemplateArgument {
  APValue value = 1;
  QualType type = 2;
}

message TemplateExpansionArgument {
  TemplateName pattern = 1;
  optional uint32 expansion_count = 2;
}

message TemplateArgumentPack {
  repeated TemplateArgument elements = 1;
}

message TemplateArgument {
  oneof value {
    Empty null_argument = 1;
    QualType type = 2;
    DeclarationTemplateArgument declaration = 3;
    QualType null_pointer_type = 4;
    IntegralTemplateArgument integral = 5;
    StructuralTemplateArgument structural_value = 6;
    TemplateName template_name = 7;
    TemplateExpansionArgument template_expansion = 8;
    ExpressionValue expression = 9;
    TemplateArgumentPack pack = 10;
  }
}

message TemplateParameterList {
  reserved 2, 3, 4;
  reserved "left_angle", "right_angle", "template_keyword";
  repeated DeclarationValue parameters = 1;
  ExpressionValue requires_clause = 5;
}

message CXXBaseSpecifier {
  reserved 2, 5;
  reserved "type_source", "written_access";
  reserved 3, 8;
  reserved "ellipsis_location", "source_range";
  QualType type = 1;
  optional AccessSpecifier access = 4;
  optional bool is_virtual = 6;
  optional bool is_pack_expansion = 7;
}

message CXXCtorInitializer {
  reserved 6;
  reserved "type_source";
  reserved 7, 8, 11;
  reserved "is_written", "source_order", "source_range";
  ExpressionValue initializer = 5;
  optional bool is_virtual_base = 9;
  optional bool is_pack_expansion = 10;
  oneof target {
    QualType base_type = 1;
    DeclarationSymbol member = 2;
    DeclarationSymbol indirect_member = 3;
    QualType delegating_type = 4;
  }
}

message LambdaCapture {
  reserved 3, 6;
  reserved "ellipsis_location", "location";
  optional LambdaCaptureKind kind = 1;
  DeclarationSymbol variable = 2;
  optional bool is_implicit = 4;
  optional bool is_pack_expansion = 5;
}

message CXXTemporary {
  DeclarationSymbol destructor = 1;
}

message ConceptReference {
  reserved 5, 7, 8, 9, 10;
  reserved "has_explicit_template_arguments", "left_angle", "right_angle", "source_range", "template_keyword";
  DeclarationSymbol concept_declaration = 1;
  DeclarationSymbol found_declaration = 2;
  NestedNameSpecifier qualifier = 3;
  DeclarationName name = 4;
  repeated TemplateArgument arguments = 6;
}

message TypeConstraint {
  ConceptReference concept_reference = 1 [json_name = "concept"];
  ExpressionValue immediately_declared_constraint = 2;
  optional uint32 argument_pack_substitution_index = 3;
}

message SubstitutionDiagnostic {
  reserved 1;
  reserved "location";
  optional string message = 2;
}

message ConstraintDetail {
  oneof detail {
    ExpressionValue substituted_constraint = 1;
    SubstitutionDiagnostic diagnostic = 2;
    ConceptReference concept_reference = 3;
  }
}

message ConstraintSatisfaction {
  optional bool is_satisfied = 1;
  optional bool contains_errors = 2;
  repeated ConstraintDetail details = 3;
}

message RequirementInfo {
  optional bool is_dependent = 1;
  optional bool contains_unexpanded_parameter_pack = 2;
  optional bool is_satisfied = 3;
}

message TypeRequirement {
  RequirementInfo requirement = 1;
  oneof result {
    QualType required_type = 2;
    SubstitutionDiagnostic substitution_error = 3;
  }
}

message ReturnTypeRequirement {
  optional bool is_dependent = 4;
  oneof value {
    Empty unconstrained = 1;
    TemplateParameterList constraint_parameters = 2;
    SubstitutionDiagnostic substitution_error = 3;
  }
  optional bool contains_unexpanded_parameter_pack = 5;
}

message ExprRequirement {
  reserved 5;
  reserved "noexcept_location";
  RequirementInfo requirement = 1;
  optional bool is_simple = 4;
  ReturnTypeRequirement return_type = 6;
  optional ExprRequirementSatisfactionStatus satisfaction_status = 7;
  ExpressionValue substituted_return_type_constraint = 8;
  oneof result {
    ExpressionValue expression = 2;
    SubstitutionDiagnostic substitution_error = 3;
  }
}

message NestedRequirement {
  RequirementInfo requirement = 1;
  ExpressionValue constraint_expression = 2;
  ConstraintSatisfaction satisfaction = 3;
  optional bool has_invalid_constraint = 4;
  optional string invalid_constraint_entity = 5;
}

message ConceptRequirement {
  oneof value {
    TypeRequirement type = 1;
    ExprRequirement expression = 2;
    NestedRequirement nested = 3;
  }
}

message ComplexIntValue {
  APSIntBits real = 1;
  APSIntBits imaginary = 2;
}

message ComplexFloatValue {
  APFloatBits real = 1;
  APFloatBits imaginary = 2;
}

message APValueSequence {
  repeated APValue elements = 1;
}

message APArrayValue {
  repeated APValue initialized_elements = 1;
  APValue filler = 2;
  optional uint64 size = 3;
}

message APStructBaseValue {
  TypeDescription type = 1;
  APValue value = 2;
}

message APStructFieldValue {
  DeclarationSymbol field = 1;
  APValue value = 2;
}

message APStructValue {
  repeated APStructBaseValue base_values = 1;
  repeated APStructFieldValue field_values = 2;
}

message APUnionValue {
  DeclarationSymbol active_field = 1;
  APValue value = 2;
}

message APTypeInfoLValue {
  QualType type = 1;
}

message APDynamicAllocation {
  reserved 1;
  reserved "allocation_index";
  QualType type = 2;
}

message APLValueBase {
  reserved 6, 7;
  reserved "call_index", "version";
  oneof value {
    Empty null_base = 1;
    DeclarationSymbol declaration = 2;
    ExpressionValue expression = 3;
    APTypeInfoLValue type_info = 4;
    APDynamicAllocation dynamic_allocation = 5;
  }
}

message APLValuePathEntry {
  optional bool is_virtual_base = 3;
  oneof value {
    uint64 array_index = 1;
    DeclarationSymbol declaration = 2;
  }
}

message APLValue {
  APLValueBase base = 1;
  optional sint64 offset_bytes = 2;
  repeated APLValuePathEntry path = 3;
  optional bool is_one_past_end = 4;
  optional bool is_null_pointer = 5;
}

message APMemberPointer {
  DeclarationSymbol declaration = 1;
  repeated DeclarationSymbol path = 2;
  optional bool is_derived_member = 3;
}

message APAddrLabelDiff {
  ExpressionValue left_expression = 1;
  ExpressionValue right_expression = 2;
}

message APValue {
  oneof value {
    Empty no_object = 1;
    Empty indeterminate = 2;
    APSIntBits integer = 3;
    APFloatBits floating = 4;
    APFixedPointBits fixed_point = 5;
    ComplexIntValue complex_integer = 6;
    ComplexFloatValue complex_floating = 7;
    APLValue lvalue = 8;
    APValueSequence vector = 9;
    APArrayValue array = 10;
    APStructValue structure = 11;
    APUnionValue union_value = 12;
    APMemberPointer member_pointer = 13;
    APAddrLabelDiff address_label_difference = 14;
  }
}

message DeclInfo {
  reserved 1, 4, 5;
  reserved "canonical_declaration", "lexical_context", "previous_declaration";
  DeclarationSymbol containing_scope = 2;
  repeated AttributeValue attributes = 3;
  optional bool is_implicit = 6;
  optional bool is_invalid = 7;
}

message NamedDeclInfo {
  reserved 4;
  reserved "usr";
  DeclInfo declaration = 1;
  DeclarationName name = 2;
  optional string qualified_name = 3;
}

message TypeDeclInfo {
  NamedDeclInfo named = 1;
  TypeValue declared_type = 2;
}

message TagDeclInfo {
  reserved 4;
  reserved "definition";
  TypeDeclInfo type_declaration = 1;
  optional TagKind tag_kind = 2;
  optional bool is_complete_definition = 3;
}

message RecordDeclInfo {
  TagDeclInfo tag = 1;
  repeated DeclarationValue members = 2;
}

message ValueDeclInfo {
  NamedDeclInfo named = 1;
  QualType type = 2;
}

message DeclaratorDeclInfo {
  ValueDeclInfo value = 1;
  QualType declared_type = 2;
}

message FunctionDeclInfo {
  reserved 5, 10, 11, 12;
  reserved "body_owner_declaration", "canonical_declaration", "definition", "previous_declaration";
  DeclaratorDeclInfo declarator = 1;
  QualType return_type = 2;
  repeated DeclarationValue parameters = 3;
  StatementValue body = 4;
  optional bool is_this_declaration_a_definition = 6;
  optional bool is_variadic = 7;
  optional bool is_constexpr = 8;
  optional StorageClass storage_class = 9;
}

message CXXMethodDeclInfo {
  FunctionDeclInfo function = 1;
  DeclarationSymbol parent_record = 2;
  optional bool is_static = 3;
  optional bool is_virtual = 4;
  optional bool is_const = 5;
  optional bool is_volatile = 6;
  optional RefQualifier ref_qualifier = 7;
  repeated DeclarationSymbol overridden_methods = 8;
}

message VarDeclInfo {
  DeclaratorDeclInfo declarator = 1;
  ExpressionValue initializer = 2;
  optional StorageClass storage_class = 3;
  optional bool is_constexpr = 4;
}

message ExprInfo {
  reserved 1;
  reserved "statement";
  QualType type = 2;
  optional ValueCategory value_category = 3;
  optional ObjectKind object_kind = 4;
  optional bool is_type_dependent = 5;
  optional bool is_value_dependent = 6;
  optional bool is_instantiation_dependent = 7;
  optional bool contains_unexpanded_parameter_pack = 8;
  optional bool contains_errors = 9;
}

message CallExprInfo {
  ExprInfo expression = 1;
  ExpressionValue callee_expression = 2;
  DeclarationSymbol direct_callee = 3;
  repeated ExpressionValue arguments = 4;
}

message CastExprInfo {
  ExprInfo expression = 1;
  ExpressionValue operand = 2;
  optional CastKind kind = 3;
  repeated CXXBaseSpecifier base_path = 4;
}

message CXXConstructExprInfo {
  ExprInfo expression = 1;
  DeclarationSymbol constructor = 2;
  repeated ExpressionValue arguments = 3;
  optional ConstructionKind construction_kind = 4;
  optional bool is_elidable = 5;
  optional bool is_list_initialization = 6;
  optional bool is_std_initializer_list_initialization = 7;
  optional bool requires_zero_initialization = 8;
  optional bool had_multiple_candidates = 9;
}

message TypeInfo {
  optional string canonical_spelling = 1;
  optional bool is_dependent = 2;
  optional bool is_instantiation_dependent = 3;
  optional bool contains_unexpanded_parameter_pack = 4;
  optional string spelling = 5;
}

enum DeclLinkageLanguage {
  DECL_LINKAGE_LANGUAGE_UNSPECIFIED = 0;
  DECL_LINKAGE_LANGUAGE_C = 1;
  DECL_LINKAGE_LANGUAGE_CXX = 2;
}

enum DeclTemplateSpecializationKind {
  DECL_TEMPLATE_SPECIALIZATION_KIND_UNSPECIFIED = 0;
  DECL_TEMPLATE_SPECIALIZATION_KIND_UNDECLARED = 1;
  DECL_TEMPLATE_SPECIALIZATION_KIND_IMPLICIT_INSTANTIATION = 2;
  DECL_TEMPLATE_SPECIALIZATION_KIND_EXPLICIT_SPECIALIZATION = 3;
  DECL_TEMPLATE_SPECIALIZATION_KIND_EXPLICIT_INSTANTIATION_DECLARATION = 4;
  DECL_TEMPLATE_SPECIALIZATION_KIND_EXPLICIT_INSTANTIATION_DEFINITION = 5;
}

enum DeclPragmaCommentKind {
  DECL_PRAGMA_COMMENT_KIND_UNSPECIFIED = 0;
  DECL_PRAGMA_COMMENT_KIND_UNKNOWN = 1;
  DECL_PRAGMA_COMMENT_KIND_LINKER = 2;
  DECL_PRAGMA_COMMENT_KIND_LIB = 3;
  DECL_PRAGMA_COMMENT_KIND_COMPILER = 4;
  DECL_PRAGMA_COMMENT_KIND_EXE_STR = 5;
  DECL_PRAGMA_COMMENT_KIND_USER = 6;
}

enum DeclBuiltinTemplateKind {
  DECL_BUILTIN_TEMPLATE_KIND_UNSPECIFIED = 0;
  DECL_BUILTIN_TEMPLATE_KIND_COMMON_TYPE = 1;
  DECL_BUILTIN_TEMPLATE_KIND_DEDUP_PACK = 2;
  DECL_BUILTIN_TEMPLATE_KIND_MAKE_INTEGER_SEQ = 3;
  DECL_BUILTIN_TEMPLATE_KIND_TYPE_PACK_ELEMENT = 4;
}

enum DeclVariableTLSKind {
  DECL_VARIABLE_TLS_KIND_UNSPECIFIED = 0;
  DECL_VARIABLE_TLS_KIND_NONE = 1;
  DECL_VARIABLE_TLS_KIND_STATIC = 2;
  DECL_VARIABLE_TLS_KIND_DYNAMIC = 3;
}

enum DeclVariableInitializationStyle {
  DECL_VARIABLE_INITIALIZATION_STYLE_UNSPECIFIED = 0;
  DECL_VARIABLE_INITIALIZATION_STYLE_C = 1;
  DECL_VARIABLE_INITIALIZATION_STYLE_CALL = 2;
  DECL_VARIABLE_INITIALIZATION_STYLE_LIST = 3;
  DECL_VARIABLE_INITIALIZATION_STYLE_PAREN_LIST = 4;
}

enum DeclDeductionCandidateKind {
  DECL_DEDUCTION_CANDIDATE_KIND_UNSPECIFIED = 0;
  DECL_DEDUCTION_CANDIDATE_KIND_NORMAL = 1;
  DECL_DEDUCTION_CANDIDATE_KIND_COPY = 2;
  DECL_DEDUCTION_CANDIDATE_KIND_AGGREGATE = 3;
}

enum DeclSourceDeductionGuideKind {
  DECL_SOURCE_DEDUCTION_GUIDE_KIND_UNSPECIFIED = 0;
  DECL_SOURCE_DEDUCTION_GUIDE_KIND_NONE = 1;
  DECL_SOURCE_DEDUCTION_GUIDE_KIND_ALIAS = 2;
}

message BlockCaptureInfo {
  DeclarationSymbol variable = 1;
  optional bool is_by_ref = 2;
  optional bool is_nested = 3;
  ExpressionValue copy_expression = 4;
}

enum CharacterKind {
  CHARACTER_KIND_UNSPECIFIED = 0;
  CHARACTER_KIND_ASCII = 1;
  CHARACTER_KIND_UTF8 = 2;
  CHARACTER_KIND_UTF16 = 3;
  CHARACTER_KIND_UTF32 = 4;
  CHARACTER_KIND_WIDE = 5;
}

enum StringLiteralKind {
  STRING_LITERAL_KIND_UNSPECIFIED = 0;
  STRING_LITERAL_KIND_ORDINARY = 1;
  STRING_LITERAL_KIND_UTF8 = 2;
  STRING_LITERAL_KIND_UTF16 = 3;
  STRING_LITERAL_KIND_UTF32 = 4;
  STRING_LITERAL_KIND_WIDE = 5;
}

enum UnaryExprTrait {
  UNARY_EXPR_TRAIT_UNSPECIFIED = 0;
  UNARY_EXPR_TRAIT_SIZEOF = 1;
  UNARY_EXPR_TRAIT_ALIGNOF = 2;
  UNARY_EXPR_TRAIT_OTHER = 3;
}

enum ConstantExprResult {
  CONSTANT_EXPR_RESULT_UNSPECIFIED = 0;
  CONSTANT_EXPR_RESULT_SUCCEEDED = 1;
  CONSTANT_EXPR_RESULT_FAILED = 2;
  CONSTANT_EXPR_RESULT_SIDE_EFFECTS = 3;
  CONSTANT_EXPR_RESULT_NOT_EVALUATED = 4;
}

enum SourceLocExprKind {
  SOURCE_LOC_EXPR_KIND_UNSPECIFIED = 0;
  SOURCE_LOC_EXPR_KIND_LINE = 1;
  SOURCE_LOC_EXPR_KIND_COLUMN = 2;
  SOURCE_LOC_EXPR_KIND_FILE = 3;
  SOURCE_LOC_EXPR_KIND_FUNCTION = 4;
}

enum PredefinedIdentKind {
  PREDEFINED_IDENT_KIND_UNSPECIFIED = 0;
  PREDEFINED_IDENT_KIND_FUNC = 1;
  PREDEFINED_IDENT_KIND_FUNCTION = 2;
  PREDEFINED_IDENT_KIND_PRETTY_FUNCTION = 3;
  PREDEFINED_IDENT_KIND_OTHER = 4;
}

enum ArrayTypeTrait {
  ARRAY_TYPE_TRAIT_UNSPECIFIED = 0;
  ARRAY_TYPE_TRAIT_COUNT = 1;
}

enum ExpressionTrait {
  EXPRESSION_TRAIT_UNSPECIFIED = 0;
  EXPRESSION_TRAIT_IS_LVALUE = 1;
  EXPRESSION_TRAIT_IS_XVALUE = 2;
  EXPRESSION_TRAIT_IS_PRVALUE = 3;
  EXPRESSION_TRAIT_OTHER = 4;
}

enum AtomicOpcode {
  ATOMIC_OPCODE_UNSPECIFIED = 0;
  ATOMIC_OPCODE_LOAD = 1;
  ATOMIC_OPCODE_STORE = 2;
  ATOMIC_OPCODE_EXCHANGE = 3;
  ATOMIC_OPCODE_COMPARE_EXCHANGE = 4;
  ATOMIC_OPCODE_FETCH = 5;
  ATOMIC_OPCODE_OTHER = 6;
