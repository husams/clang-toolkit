syntax = "proto3";
package ctk.match.v1;

// Native cache inventory, independent of RPC status and resource-management schemas.
message CacheResources {
  bool memory_available = 1;
  uint64 reusable_snapshots = 2;
  uint64 reusable_memory_bytes = 3;
  uint64 pending_builds = 4;
  bool storage_available = 5;
  // Physical native artifact bytes, excluding SQLite metadata and directory overhead.
  uint64 artifact_disk_bytes = 6;
  uint64 ready_snapshots = 7;
  uint64 stale_snapshots = 8;
  uint64 leased_snapshots = 9;
  string storage_root = 10;
}
