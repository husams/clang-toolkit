syntax = "proto3";

package ctk.match.v1;

import "google/protobuf/timestamp.proto";
import "match/v1/match_result.proto";
import "match/v1/parse_request.proto";
import "match/v1/parse_response.proto";

service MatchService {
  // Acquire a pinned immutable tree without evaluating a matcher. The opaque
  // tree cursor is caller-owned and is released by CloseSession or idle expiry.
  rpc Parse(ParseRequest) returns (ParseResponse);
  // Parse and match a file, continue from prior bindings, or restart over a
  // session's immutable AST. Each successful call atomically replaces the
  // latest results and increments the session revision, even for zero rows,
  // unless preserve_source requests an independent immutable result cursor.
  // Failures and resource-limit errors commit no state. Cancellation/deadline
  // prevents commit only when observed before the atomic commit; a lost
  // response or later cancellation can leave the client unsure whether commit
  // occurred. Operations on a session are serialized; stale revisions abort.
  // Invalid requests or query expressions use INVALID_ARGUMENT; stale revisions
  // use ABORTED; missing/expired sessions or selections use NOT_FOUND;
  // unsupported continuation uses FAILED_PRECONDITION.
  // RESOURCE_EXHAUSTED is all-or-error. CANCELLED and DEADLINE_EXCEEDED do not
  // commit when observed before commit.
  rpc Match(MatchRequest) returns (MatchResponse);

  // Close uses the same caller ownership as Match and is serialized with it.
  // It affects only a session belonging to that caller. A malformed session ID
  // is INVALID_ARGUMENT; a well-formed unavailable session is an idempotent OK.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
}

enum MatchTraversalMode {
  // Request default: use AS_IS.
  MATCH_TRAVERSAL_MODE_UNSPECIFIED = 0;
  // Clang TK_AsIs traversal, including implicit and template nodes.
  MATCH_TRAVERSAL_MODE_AS_IS = 1;
  // Clang's TK_IgnoreUnlessSpelledInSource traversal policy.
  MATCH_TRAVERSAL_MODE_IGNORE_UNLESS_SPELLED_IN_SOURCE = 2;
}

message MatchRequest {
  // A dynamic matcher expression, not a clang-query command. The expression
  // must parse as a native dynamic matcher. Binding continuation additionally
  // requires a Decl or Stmt matcher category for SUBTREE scope. Query and
  // exactly one target are required; missing fields or unknown enum values
  // are INVALID_ARGUMENT.
  string query = 1;
  oneof target {
    FileMatchTarget file = 2;
    SessionMatchTarget session = 3;
    BindingMatchTarget binding = 4;
  }
  MatchTraversalMode traversal_mode = 5;
  // Publish into a fresh cursor instead of replacing a retained target. The
  // source identity, revision, bindings and expiry remain unchanged. Used by
  // expression values so earlier variables stay selectable. File targets
  // already create a fresh cursor. Revision checks and failure atomicity apply
  // before publication. An empty source collection selects zero roots and
  // produces a fresh empty collection; an explicit missing row/bind is NOT_FOUND.
  bool preserve_source = 6;
}

message FileMatchTarget {
  // Server-side path, resolved relative to working_directory when not absolute.
  // A successful file query acquires a validated cached AST and creates a fresh
  // independent result cursor (called session_id in this v1 wire contract),
  // including when it returns zero rows. Failed parsing/matching creates none;
  // retrying a call whose response was lost can create another session, which
  // will expire under the server's idle policy.
  string file_path = 1;
  // Ordered compiler flags only: no executable, input, output, or extra source
  // arguments. The server supplies its configured Clang resource/toolchain
  // defaults and a default C++ language mode when no language flag is present.
  // Non-C++ language modes are INVALID_ARGUMENT.
  repeated string compile_arguments = 2;
  // Required absolute server-side directory.
  string working_directory = 3;
  // JSON file or directory on the server; empty enables automatic discovery.
  // The file's database command supplies flags and its working directory;
  // compile_arguments append overrides. Explicit lookup misses are errors.
  string compilation_database = 4;
}

message SessionMatchTarget {
  // Canonical lowercase UUIDv4 generated by the server. The session owns the
  // immutable ASTUnit and copied native binding tuples; it is process-scoped
  // and scoped to the caller principal when authentication is available.
  string session_id = 1;
  // Optional positive optimistic concurrency check; zero is INVALID_ARGUMENT,
  // and a mismatch returns ABORTED.
  optional uint64 expected_result_revision = 2;
}

message BindingMatchTarget {
  string session_id = 1;
  // Required nonempty name of a binding in the latest successful response.
  string bind = 2;
  // Optional zero-based row selector. Presence preserves row zero; when absent,
  // every previous row containing bind is selected independently; rows without
  // bind are ignored, and no matching row returns NOT_FOUND.
  optional uint64 match_index = 3;
  // UNSPECIFIED defaults to inclusive SUBTREE. SUBTREE roots and matcher
  // categories must both be Decl or Stmt (Expr is a Stmt); mismatched supported
  // categories may yield zero rows. ROOT_ONLY also supports Type and QualType.
  // SUBTREE includes the selected root and descendants visited under the
  // requested Clang traversal policy, including implicit/code/template nodes
  // in AS_IS mode. Preserve independent rows and overlapping roots; do not
  // deduplicate callback tuples.
  // Other roots/scopes/categories return FAILED_PRECONDITION. Binding or row
  // misses return NOT_FOUND. A binding is only a scope selector, never an
  // inherited matcher binding; relationship predicates can inspect the whole
  // AST and results need not lie within the selected root's source range.
  BindingMatchScope scope = 4;
  // Optional positive optimistic concurrency check; zero is INVALID_ARGUMENT,
  // and a mismatch returns ABORTED.
  optional uint64 expected_result_revision = 5;
}

message MatchResponse {
  string session_id = 1;
  // Starts at 1 for a new session and increments after each successful Match.
  uint64 result_revision = 2;
  // One item per successful callback tuple. Preserve duplicates and empty
  // bindings maps; row order is stable within this revision only.
  repeated MatchResult results = 3;
  // Absolute idle expiry; successful Match calls refresh the server-selected
  // TTL. Expired/evicted sessions and sessions lost on restart are unavailable.
  // Rows are complete before commit: resource/serialization limits return an
  // all-or-error status rather than committing a partial result.
  google.protobuf.Timestamp expires_at = 4;
}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {
}
